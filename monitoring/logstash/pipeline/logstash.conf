input {
  beats {
    port => 5044
  }
  
  tcp {
    port => 5000
    codec => json
  }
}

filter {
  # Parse Laravel logs
  if [fields][service] == "laravel" {
    grok {
      match => {
        "message" => "\[%{TIMESTAMP_ISO8601:timestamp}\] %{DATA:environment}\.%{LOGLEVEL:level}: %{GREEDYDATA:log_message}"
      }
    }
    
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
    
    mutate {
      remove_field => [ "timestamp" ]
    }
  }
  
  # Parse AI Service logs
  if [fields][service] == "ai-service" {
    json {
      source => "message"
    }
  }
  
  # Parse Nginx access logs
  if [fields][service] == "nginx" {
    grok {
      match => {
        "message" => '%{IPORHOST:remote_addr} - %{DATA:remote_user} \[%{HTTPDATE:time_local}\] "%{WORD:method} %{URIPATHPARAM:request} HTTP/%{NUMBER:http_version}" %{NUMBER:status} %{NUMBER:body_bytes_sent} "%{DATA:http_referer}" "%{DATA:http_user_agent}" "%{DATA:http_x_forwarded_for}"'
      }
    }
    
    date {
      match => [ "time_local", "dd/MMM/yyyy:HH:mm:ss Z" ]
      target => "@timestamp"
    }
    
    mutate {
      convert => {
        "status" => "integer"
        "body_bytes_sent" => "integer"
      }
    }
  }
  
  # Add common fields
  mutate {
    add_field => {
      "environment" => "${APP_ENV:production}"
      "application" => "itsm-platform"
    }
  }
  
  # Remove sensitive data
  mutate {
    gsub => [
      "message", "password=\S+", "password=***",
      "message", "token=\S+", "token=***",
      "message", "key=\S+", "key=***"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "itsm-%{[fields][service]}-%{+YYYY.MM.dd}"
    template_name => "itsm-logs"
    template => "/usr/share/logstash/templates/itsm-logs.json"
    template_overwrite => true
  }
  
  # Send critical errors to monitoring
  if [level] == "ERROR" or [level] == "CRITICAL" {
    http {
      url => "http://backend/api/v1/monitoring/log-alert"
      http_method => "post"
      format => "json"
      mapping => {
        "service" => "%{[fields][service]}"
        "level" => "%{level}"
        "message" => "%{log_message}"
        "timestamp" => "%{@timestamp}"
        "host" => "%{host}"
      }
    }
  }
  
  # Debug output (disable in production)
  # stdout { codec => rubydebug }
}