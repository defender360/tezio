apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  - name: Elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    database: "[itsm-*]YYYY.MM.DD"
    jsonData:
      esVersion: "8.12.0"
      timeField: "@timestamp"
      maxConcurrentShardRequests: 5
    editable: true

  - name: PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    database: itsm_platform
    user: itsm_user
    secureJsonData:
      password: secure_password_here
    jsonData:
      sslmode: 'disable'
      postgresVersion: 1600
    editable: true