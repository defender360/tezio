global:
  resolve_timeout: 5m
  smtp_from: 'alerts@itsm-platform.com'
  smtp_smarthost: 'mailpit:1025'
  smtp_require_tls: false

route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: critical-alerts
      continue: true
    - match:
        severity: warning
      receiver: warning-alerts
      continue: true

receivers:
  - name: 'default'
    email_configs:
      - to: 'admin@itsm-platform.com'
        send_resolved: true
        headers:
          Subject: '[ITSM Alert] {{ .GroupLabels.alertname }} - {{ .Status | toUpper }}'
        html: |
          <h2>Alert: {{ .GroupLabels.alertname }}</h2>
          <p><b>Status:</b> {{ .Status | toUpper }}</p>
          <p><b>Severity:</b> {{ .CommonLabels.severity }}</p>
          {{ range .Alerts }}
          <hr>
          <p><b>Summary:</b> {{ .Annotations.summary }}</p>
          <p><b>Description:</b> {{ .Annotations.description }}</p>
          <p><b>Started at:</b> {{ .StartsAt }}</p>
          {{ if ne .Status "firing" }}<p><b>Ended at:</b> {{ .EndsAt }}</p>{{ end }}
          {{ end }}

  - name: 'critical-alerts'
    email_configs:
      - to: 'oncall@itsm-platform.com'
        send_resolved: true
    webhook_configs:
      - url: 'http://backend/api/v1/alerts/webhook'
        send_resolved: true

  - name: 'warning-alerts'
    email_configs:
      - to: 'ops-team@itsm-platform.com'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']