filebeat.inputs:
  # Laravel application logs
  - type: log
    enabled: true
    paths:
      - /var/log/laravel/*.log
    fields:
      service: laravel
    multiline.pattern: '^\[[0-9]{4}-[0-9]{2}-[0-9]{2}'
    multiline.negate: true
    multiline.match: after

  # Docker container logs
  - type: container
    enabled: true
    paths:
      - '/var/lib/docker/containers/*/*.log'
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"

  # Nginx access logs
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/access.log
    fields:
      service: nginx
      log_type: access

  # Nginx error logs
  - type: log
    enabled: true
    paths:
      - /var/log/nginx/error.log
    fields:
      service: nginx
      log_type: error

processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~
  - drop_event:
      when:
        or:
          - contains:
              message: "health"
          - contains:
              message: "metrics"

output.logstash:
  hosts: ["logstash:5044"]
  
output.elasticsearch:
  hosts: ["elasticsearch:9200"]
  protocol: "http"
  indices:
    - index: "filebeat-%{[agent.version]}-%{[fields.service]}-%{+yyyy.MM.dd}"
      when.has_fields: ['fields.service']
    - index: "filebeat-%{[agent.version]}-default-%{+yyyy.MM.dd}"

logging.level: info
logging.to_files: true
logging.files:
  path: /var/log/filebeat
  name: filebeat
  keepfiles: 7
  permissions: 0644