version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: itsm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-itsm_platform}
      POSTGRES_USER: ${DB_USERNAME:-itsm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password_here}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data_simple:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - itsm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-itsm_user} -d ${DB_DATABASE:-itsm_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: itsm_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - itsm_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PHP-FPM Backend (includes queue worker and scheduler via supervisor)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.simple
    container_name: itsm_backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-itsm_platform}
      DB_USERNAME: ${DB_USERNAME:-itsm_user}
      DB_PASSWORD: ${DB_PASSWORD:-secure_password_here}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      # Simplified - no elasticsearch
      SCOUT_DRIVER: database
      # CORS settings
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:3000"
      FRONTEND_URL: http://localhost
      # Sanctum configuration
      SANCTUM_STATEFUL_DOMAINS: "localhost,localhost:80,localhost:8000"
      SESSION_DOMAIN: localhost
      SESSION_SAME_SITE: lax
      SESSION_HTTP_ONLY: "true"
      # Mail settings for SendGrid
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-smtp.sendgrid.net}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-apikey}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-YOUR_SENDGRID_API_KEY}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@defender360.com.br}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Defender360 ITSM}
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - itsm_network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: itsm_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - backend_vendor:/var/www/html/vendor:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - itsm_network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Vue.js Frontend (Development)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: itsm_frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "80:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_DEV_MODE=true
    depends_on:
      - nginx
    networks:
      - itsm_network

  # Mailpit removed - using SendGrid for email delivery

networks:
  itsm_network:
    driver: bridge
    name: itsm_network

volumes:
  postgres_data_simple:
    driver: local
  redis_data:
    driver: local
  backend_vendor:
    driver: local